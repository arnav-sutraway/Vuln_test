<!DOCTYPE html>
<html>
<head>
    <title>User Profile</title>
</head>
<body>

    <h1>User Profile</h1>

    <!-- SAFE: Escaped output -->
    <p>Username: {{ username }}</p>

    <!-- XSS #5: Unsafe HTML rendering -->
    <!-- Vulnerable: using |safe in Jinja2 or dangerouslySetInnerHTML in React -->
    <div>
        <h1>Welcome back, </h1>
        <p>{{ user_bio | safe }}</p>
    </div>
    <div class="bio">
        {{ bio | safe }}
    </div>

</body>
</html>
